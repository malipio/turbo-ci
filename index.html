<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>turbo-ci: Turbo Pascal 7.0 demos in js-dos</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
  <style>
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    p {
      max-width: 40em;
      color: #aaa;
    }
    #picker {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    #picker button {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.4rem 0.8rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #picker button.active {
      background: #345;
      border-color: #5af;
    }
    #dos-container {
      width: 640px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Turbo Pascal 7.0 demos, compiled and run in your browser</h1>
  <p id="description"></p>
  <div id="picker"></div>
  <div id="dos-container"></div>

  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <script>
    const EXAMPLES = [{"file":"hello.pas","title":"hello.pas","description":"A minimal Turbo Pascal program - prints a line of text to the console.","program":"HELLO","bundle":"hello.jsdos"},{"file":"clock.pas","title":"clock.pas","description":"An analog clock drawn with the Graph (BGI) unit, updated once a second.","program":"CLOCK","bundle":"clock.jsdos"}];

    const picker = document.getElementById("picker");
    const description = document.getElementById("description");
    const container = document.getElementById("dos-container");

    let current = null; // currently-running DosProps instance, or null
    let switching = false; // guards against overlapping stop()/start() races

    async function runExample(example) {
      if (switching) return;
      switching = true;

      for (const button of picker.children) {
        button.classList.toggle("active", button.dataset.file === example.file);
        button.disabled = true;
      }
      description.textContent =
        "Running " + example.bundle + ", compiled from src/" + example.file +
        " with Turbo Pascal 7.0. " + example.description;

      try {
        if (current) {
          await current.stop();
          current = null;
        }
        await new Promise((resolve) => {
          current = Dos(container, {
            url: example.bundle,
            onEvent(event) {
              if (event === "ci-ready") resolve();
            },
          });
        });
      } catch (error) {
        console.error("Unable to run example", error);
        description.textContent = "Unable to run " + example.bundle + ": " + error;
      } finally {
        for (const button of picker.children) button.disabled = false;
        switching = false;
      }
    }

    for (const example of EXAMPLES) {
      const button = document.createElement("button");
      button.textContent = example.title;
      button.dataset.file = example.file;
      button.addEventListener("click", () => runExample(example));
      picker.appendChild(button);
    }

    runExample(EXAMPLES[0]);
  </script>
</body>
</html>
