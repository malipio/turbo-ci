name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y dosbox

      - run: npm ci

      - run: node ci/fetch-tp7.js

      - run: node ci/build-site.js

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-site
          keep_files: true

  deploy-pr-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event.action != 'closed'
        with:
          filters: |
            pas:
              - 'src/**/*.pas'
          list-files: json

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y dosbox ffmpeg xvfb xdotool
        if: github.event.action != 'closed'

      - run: npm ci
        if: github.event.action != 'closed'

      - run: node ci/fetch-tp7.js
        if: github.event.action != 'closed'

      - run: node ci/build-site.js
        if: github.event.action != 'closed'

      - name: Record demo GIFs for changed examples
        if: github.event.action != 'closed' && steps.filter.outputs.pas == 'true'
        run: |
          set -e
          for path in $(echo '${{ steps.filter.outputs.pas_files }}' | jq -r '.[]'); do
            node ci/record-demo.js "$(basename "$path")"
          done

      - id: preview-deploy
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist-site

      - name: Compose demo comment
        if: github.event.action != 'closed' && steps.filter.outputs.pas == 'true'
        run: |
          {
            echo "### Demo recordings"
            for f in dist-site/demo-*.gif; do
              echo "![$(basename "$f" .gif)](${{ steps.preview-deploy.outputs.preview-url }}/$(basename "$f"))"
              echo
            done
          } > "$RUNNER_TEMP/demo-comment.md"

      - name: Comment demo GIFs
        if: github.event.action != 'closed' && steps.filter.outputs.pas == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: demo-gifs
          path: ${{ runner.temp }}/demo-comment.md
