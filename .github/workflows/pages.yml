name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y dosbox ffmpeg xvfb xdotool

      - run: npm ci

      - run: node ci/fetch-tp7.js

      - run: node ci/build-site.js

      - name: Record demo GIFs
        run: |
          set -e
          for f in src/*.pas; do
            node ci/record-demo.js "$(basename "$f")"
          done

      - name: Update README demo GIF cache-busters
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const sha = process.argv[1];
            const readme = fs.readFileSync("README.md", "utf8");
            const updated = readme.replace(
              /(https:\/\/malipio\.github\.io\/turbo-ci\/demo-(?:hello|clock)\.gif)(\?[^)\s]*)?/g,
              (_m, base) => `${base}?sha=${sha}`,
            );
            if (updated !== readme) fs.writeFileSync("README.md", updated);
          ' "${{ github.sha }}"

      - name: Commit README changes
        run: |
          set -e
          if git diff --quiet README.md; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README demo GIF cache-busters [skip ci]"
          git push origin HEAD:main

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-site
          keep_files: true

  deploy-pr-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y dosbox ffmpeg xvfb xdotool
        if: github.event.action != 'closed'

      - run: npm ci
        if: github.event.action != 'closed'

      - run: node ci/fetch-tp7.js
        if: github.event.action != 'closed'

      - run: node ci/build-site.js
        if: github.event.action != 'closed'

      - name: Record demo GIFs
        if: github.event.action != 'closed'
        run: |
          set -e
          for f in src/*.pas; do
            node ci/record-demo.js "$(basename "$f")"
          done

      - id: preview-deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist-site

      - name: Compose demo comment
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          {
            echo "### Demo recordings"
            for f in dist-site/demo-*.gif; do
              echo "![$(basename "$f" .gif)](${{ steps.preview-deploy.outputs.preview-url }}/$(basename "$f")?sha=${{ github.sha }})"
              echo
            done
          } > "$RUNNER_TEMP/demo-comment.md"

      - name: Comment demo GIFs
        if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: demo-gifs
          path: ${{ runner.temp }}/demo-comment.md
