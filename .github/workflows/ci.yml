name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: sudo apt-get update && sudo apt-get install -y dosbox

      - run: npm ci

      - run: node ci/fetch-tp7.js

      - name: Compile Turbo Pascal examples
        run: |
          set -e
          for f in src/*.pas; do
            echo "::group::$f"
            node ci/run-dos.js "$f"
            echo "::endgroup::"
          done
